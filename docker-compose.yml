version: "3.8"

services:
  vision-sentinel:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vision-sentinel
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
      - DATA_DIR=/app/data
      - LOCAL_MODEL_ENABLED=true
      - GEMINI_ENABLED=false
      - GEMINI_FREE_TIER_ONLY=true
      - AWS_STORAGE_ENABLED=false
      - COOL_ENABLED=false
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
