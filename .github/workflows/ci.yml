name: Vision Sentinel CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Build, Lint & Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Verify OpenCV 5 and environment diagnostics
        run: |
          python scripts/check_environment.py

      - name: Run Ruff linter and formatter checks
        run: |
          ruff check .
          ruff format --check .

      - name: Run Pytest test suite
        run: |
          pytest -v --tb=short

      - name: Run synthetic data generator and evaluation report
        run: |
          python scripts/generate_evaluation_report.py
